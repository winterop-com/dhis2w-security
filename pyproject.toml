[project]
name = "dhis2w-security"
version = "1.31.1"
description = "dhis2w plugin pack: the d2w security surface and the read-only security_* MCP tools."
readme = "README.md"
authors = [{ name = "Morten Hansen", email = "morten@winterop.com" }]
requires-python = ">=3.13"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
keywords = ["dhis2", "security", "audit", "plugin", "mcp"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  # The plugin host, the profile resolver, `open_client`, and the CLI output helpers.
  "dhis2w-core==1.31.1",
  # `Dhis2Client`, the auth schemes, the error hierarchy, and the generated OAS models.
  "dhis2w-client==1.31.1",
  # Every view model and every check result.
  "pydantic>=2.13",
  # The `d2w security` sub-app.
  "typer>=0.27.1",
  # The audit console and the progress reporter.
  "rich>=15",
  # The guardrailed probe client and the release-feed fetch.
  "httpx2>=2.12.0",
  # `mcp.types.ToolAnnotations` on the read-only tools; fastmcp ships the `mcp` package.
  "fastmcp>=4.0",
]

[project.urls]
Homepage = "https://github.com/winterop-com/dhis2w-security"
Repository = "https://github.com/winterop-com/dhis2w-security"

[project.entry-points."dhis2w.plugins.v1"]
security = "dhis2w_security.plugin:plugin"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "dhis2w-core[testing]==1.31.1",
  "dhis2w-cli==1.31.1",
  "ruff>=0.16.3",
  "mypy>=2.3.1",
  "pyright>=1.1.414",
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4",
  "respx>=0.23",
  "pytest-httpx2>=1.0.0",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
fixable = ["ALL"]
select = ["E", "W", "F", "I", "D", "SIM", "UP", "B", "TID251"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"httpx".msg = "Import httpx2. The original httpx is allowed only in tests, for the Response and Request objects respx consumes."
"httpcore".msg = "Import httpcore2."
"urllib.request".msg = "Use httpx2."

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "TID251"]
"**/__init__.py" = ["D104"]
"src/**/*.py" = ["D102", "D105", "D107"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.pytest.ini_options]
asyncio_mode = "auto"
norecursedirs = ["examples", ".git", ".venv", "__pycache__", "build", "dist"]
filterwarnings = [
  # DHIS2 wire payloads carry plenty of fields not declared on the generated models (which use
  # `extra="allow"`). pydantic-core re-emits these as a `PydanticSerializationUnexpectedValue`
  # UserWarning during model_dump. Pin the message regex to that class name so genuine
  # `Pydantic serializer warnings:` text from other sources still surfaces.
  "ignore:.*PydanticSerializationUnexpectedValue.*:UserWarning",
]
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "contract: live-schema contract tests against play.im.dhis2.org (network, opt-in)",
  "upstream_bug: tests paired with a DHIS2_ISSUES.md entry — bug-still-present + workaround halves",
]

[tool.coverage.run]
branch = true
relative_files = true
source = ["src"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:"]
precision = 2
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
strict_equality = true

[tool.pyright]
include = ["src", "tests"]
# `uv sync` / `uv venv` put the environment here; pyright reads it for third-party types.
venvPath = "."
venv = ".venv"
extraPaths = ["tests"]
exclude = ["**/.venv", "**/build", "**/dist"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
useLibraryCodeForTypes = true
reportPrivateUsage = false
reportUnusedFunction = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownParameterType = false
reportUnknownVariableType = false
reportMissingTypeArgument = false
reportMissingTypeStubs = false
reportUnknownLambdaType = false
reportMissingImports = "warning"
reportMissingModuleSource = false
reportDeprecated = "error"
