name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege token: the job only reads the checkout and runs lint + test.
permissions:
  contents: read

jobs:
  lint-test:
    name: lint + test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python (pinned to 3.13 — matches CLAUDE.md)
        run: uv python install 3.13

      - name: Sync the environment
        run: make install

      - name: Lint (ruff + mypy + pyright)
        run: make lint

      - name: Test
        run: make test
